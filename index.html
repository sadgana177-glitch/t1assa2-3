/* Layout: grid-paper notebook. A tile-colored hero over a two-column gate (password | contact links), then a tabbed workspace. */
:root{
  --bg:#f3f6fb; --paper:#ffffff; --ink:#12213a; --muted:#51627d; --line:#d3dcea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e2ecf9;
  --t2:#8fd0ef; --t1:#8bcb8a; --t0:#f4e56a; --tile-ink:#10223a;
  --ok:#14763f; --ok-soft:#dcf2e4; --bad:#b0352a; --bad-soft:#fbe4e0;
  --grid:rgba(29,79,145,.07);
  --fd:'Reem Kufi','Cairo','Tahoma',sans-serif;
  --fb:'IBM Plex Sans Arabic','Tajawal','Segoe UI','Tahoma',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1522; --paper:#162235; --ink:#e8eff9; --muted:#a0b2ca; --line:#2a3b54;
    --brand:#7fb4ff; --brand-ink:#0b1b33; --brand-soft:#1d3253;
    --ok:#5bd491; --ok-soft:#13362a; --bad:#ff8c7c; --bad-soft:#42211d;
    --grid:rgba(127,180,255,.06); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1522; --paper:#162235; --ink:#e8eff9; --muted:#a0b2ca; --line:#2a3b54;
  --brand:#7fb4ff; --brand-ink:#0b1b33; --brand-soft:#1d3253;
  --ok:#5bd491; --ok-soft:#13362a; --bad:#ff8c7c; --bad-soft:#42211d;
  --grid:rgba(127,180,255,.06); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink); font-family:var(--fb); font-size:16px; line-height:1.75;
}
#app{min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.e{unicode-bidi:isolate;direction:rtl;white-space:nowrap;font-weight:600}
.e sup{font-size:.72em;line-height:0;vertical-align:super}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

/* hero */
.hero{display:grid;gap:6px;justify-items:start;padding-block:18px 22px}
.tiles-mark{display:flex;gap:6px;margin-bottom:6px}
.tiles-mark i{display:block;border:2px solid rgba(16,34,58,.4);border-radius:3px}
.tiles-mark .m2{width:34px;height:34px;background:var(--t2)}
.tiles-mark .m1{width:14px;height:34px;background:var(--t1)}
.tiles-mark .m0{width:14px;height:14px;background:var(--t0);align-self:flex-end}
.grade{display:inline-block;background:var(--brand);color:var(--brand-ink);font-family:var(--fd);font-weight:700;font-size:1.35rem;padding:2px 16px;border-radius:8px}
.kicker{color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(1.9rem,6vw,3.1rem);font-weight:700}
.form-line{font-size:1.15rem}
.byline{color:var(--muted);font-weight:500}

/* cards, buttons, inputs */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:6px}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.row{display:flex;gap:10px;align-items:stretch}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 22px;font-weight:700;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.ghost:hover{border-color:var(--brand)}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.okmsg{color:var(--ok);font-weight:600;margin-top:8px}

/* gate */
.gate{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.gate .ghost{margin-top:18px}
#tpanel{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
.link:hover{border-color:var(--brand)}
.link b{display:block;font-weight:700;line-height:1.4}
.link small{color:var(--muted);font-size:.9rem}
.disc{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff}
.disc svg{width:24px;height:24px}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block;font-weight:600}

/* workspace */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--fd);font-weight:700;font-size:1.15rem}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--fd);font-weight:700;font-size:1.1rem}
.tab[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.contact{background:var(--brand-soft);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:grid;gap:6px}
.cname{display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.crow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.crow a{color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.95rem}
.chip[aria-current=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lesson h2{font-size:1.5rem;margin-bottom:4px}
.big{font-size:1.5rem;margin:8px 0 14px}
.step{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--brand);border-radius:12px;padding:14px 18px;margin-bottom:12px;min-width:0}
.step h3{font-size:1.05rem;margin-bottom:4px;color:var(--brand)}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.tries{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.try{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.try.ok{border-color:var(--ok);background:var(--ok-soft)}
.try.bad{border-color:var(--bad);background:var(--bad-soft)}
.tdetail{border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.tdetail.ok{background:var(--ok-soft);color:var(--ok)}
.tdetail.bad{background:var(--bad-soft);color:var(--bad)}
.ans{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:1.15rem;font-weight:700;margin-top:6px}
.prac{margin-top:18px}
.prac h3{font-size:1.1rem;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:start;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--brand-soft)}

/* algebra tiles */
.dims{display:grid;grid-template-columns:auto auto;justify-content:center;gap:6px 8px;margin:14px 0;direction:rtl}
.dtop,.dside{text-align:center;font-weight:700;color:var(--brand);border:2px solid var(--brand);border-radius:6px;padding:2px 6px}
.dtop{grid-column:2}
.dside{grid-row:2;grid-column:1;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center}
.dtop[hidden],.dside[hidden]{display:none}
.tiles{--u:min(21vw,92px);--s:calc(var(--u)*.42);grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(3,var(--u)) var(--s);grid-template-rows:var(--u) var(--s) var(--s);gap:3px}
.t{display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--tile-ink);border:2px solid rgba(16,34,58,.4);border-radius:3px;transition:background .25s}
.t.x2{background:var(--t2)} .t.x{background:var(--t1)} .t.o{background:var(--t0)}
.t.empty{background:transparent;border:2px dashed var(--line);color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:20px;height:20px;border-radius:3px;border:2px solid rgba(16,34,58,.4);display:inline-block}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--brand)}
.qtext{font-size:1.25rem;font-family:var(--fd);margin-bottom:14px}
.score{font-family:var(--fd);font-size:3rem;font-weight:700;color:var(--brand)}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;background:var(--paper)}
.rev.ok{border-inline-start:5px solid var(--ok)} .rev.bad{border-inline-start:5px solid var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sum{display:grid;gap:4px;margin:10px 0;padding:12px 16px;border-radius:10px;background:var(--brand-soft)}

@media (max-width:760px){
  .gate{grid-template-columns:minmax(0,1fr)}
  .row{flex-wrap:wrap} .row .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function exHTML(n){
  var d=EX[n-1],k=S.st[n]||0,pk=(S.pk[n]===undefined?-1:S.pk[n]),h='';
  for(var i=0;i<=k;i++){
    var s=d.steps[i];
    h+='<div class="step"><h3>'+ar(i+1)+'. '+s.t+'</h3><p>'+ar(s.h)+'</p>';
    if(s.try){
      h+='<div class="tries">'+d.tries.map(function(t,j){return '<button class="try'+(pk===j?(t.ok?' ok':' bad'):'')+'" data-act="try" data-k="'+j+'">'+E(t.f)+'</button>';}).join('')+'</div>';
      if(pk>=0)h+=tryDetail(d,d.tries[pk]);
    }
    if(s.ans)h+='<div class="ans">'+E(s.ans)+'</div>';
    h+='</div>';
  }
  var last=k>=d.steps.length-1;
  var pr='';
  if(last){
    var p=d.prac,c=S.pr[n]===undefined?-1:S.pr[n];
    pr='<div class="prac card"><h3>جرّب بنفسك</h3><p style="margin-bottom:10px">'+p.qh+'</p><div class="opts">'+p.o.map(function(o,j){
      var cls='opt'+(c>=0?(j===p.c?' ok':(j===c?' bad':'')):'');
      return '<button class="'+cls+'" data-act="prac" data-k="'+j+'"'+(c>=0?' disabled':'')+'>'+ptxt(o)+'</button>';}).join('')+'</div>'+
      (c>=0?'<div class="why"><b>'+(c===p.c?'أحسنت! ':'الإجابة الصحيحة: ')+'</b>'+(c===p.c?'':ptxt(p.o[p.c])+'<br>')+ar(p.why)+'</div>':'')+'</div>';
  }
  return '<h2>'+(n===EX.length?'التحدّي':'مثال '+ar(n))+': '+d.tab+'</h2><p class="big">'+(d.bmode?'':'حلّل تحليلاً تاماً: ')+E(d.q)+'</p>'+h+
   '<div class="stepbar">'+(last?'':'<button class="btn" data-act="enext">الخطوة التالية</button>')+(k>0?'<button class="ghost" data-act="eback">رجوع</button>':'')+dots(d.steps.length,k)+'</div>'+pr;
}

  var msg=sc>=9?'ممتاز!':sc>=7?'جيد جداً':sc>=5?'جيد، راجع الأخطاء':'راجع الشرح ثم أعد المحاولة';
  var rev=QZ.map(function(q,i){var ok=Q.ans[i]===q.c;
    return '<div class="rev '+(ok?'ok':'bad')+'"><div><b>'+ar(i+1)+'.</b> '+q.q+'</div><div>إجابتك: '+ptxt(q.o[Q.ans[i]])+(ok?' ✓':' ✗')+'</div>'+(ok?'':'<div>الصحيح: '+ptxt(q.o[q.c])+'</div>')+'<div class="muted">'+q.why+'</div></div>';}).join('');
  return '<section class="card"><h2>نتيجة '+esc(Q.name)+'</h2><p class="score">'+ar(sc)+' من '+ar(QZ.length)+'</p><p><b>'+msg+'</b></p>'+
   '<div class="actions"><button class="btn" data-act="qcopy">نسخ النتيجة لإرسالها للمعلمة</button><button class="ghost" data-act="qagain">إعادة الاختبار</button></div><p id="cmsg" class="okmsg" role="status"></p></section>'+
   contactHTML(false)+'<h3 style="margin-top:20px">مراجعة الإجابات</h3>'+rev;
}
function score(){var s=0;Q.ans.forEach(function(a,i){if(a===QZ[i].c)s++;});return s;}

/* ---------- render + events ---------- */
var app=$('#app');
function render(){app.innerHTML=S.view==='gate'?gateHTML():appHTML();}
function top(){try{window.scrollTo(0,0);}catch(e){}}
function enter(){S.view='app';render();top();}
function login(){
  var v=$('#pw').value,er=$('#perr');
  if(!v.trim()){er.textContent='اكتب كلمة السر أولاً.';er.hidden=false;return;}
  if(hashPw(v)===CFG.ph){sset('unl',CFG.ph);enter();}
  else{er.textContent='كلمة السر غير صحيحة. تأكد منها وحاول مرة أخرى.';er.hidden=false;}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function refreshTeacher(){var p=$('#tpanel');if(p&&!p.hidden)p.innerHTML=teacherPanel();}
function buildDoc(cfg){
  var cssEl=document.getElementById('css'),jsEl=document.getElementById('main');
  if(!cssEl||!jsEl)throw new Error('missing');
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var st=document.head?document.head.querySelector('style'):null;
  if(st&&/safe-area-inset/.test(st.textContent)&&st.id!=='css')reset=st.textContent;
  var S1='<'+'script',S2='</'+'script>';
  var body='<title>'+TITLE+'</title><meta name="claude:viewport-fit-sides" content="cover"><style id="css">'+cssEl.textContent+'</style><div id="app" dir="rtl" lang="ar"></div>'+
    S1+' type="application/json" id="cfg">'+JSON.stringify(cfg)+S2+S1+' id="main">'+jsEl.textContent+S2;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+body+'</body></html>';
}
function saveTeacher(){
  var a=$('#np1').value,b=$('#np2').value,m=$('#tmsg');
  m.className='err';
  if(toLatin(a).trim().length<4){m.textContent='اكتبي ٤ خانات على الأقل.';return;}
  if(toLatin(a).trim()!==toLatin(b).trim()){m.textContent='الكلمتان غير متطابقتين.';return;}
  if(!T.art){m.textContent='الحفظ غير متاح في هذا العرض.';return;}
  var ph=hashPw(a);m.className='muted';m.textContent='جارٍ الحفظ...';
  var doc;try{doc=buildDoc({ph:ph});}catch(e){m.className='err';m.textContent='تعذّر تجهيز الصفحة للحفظ.';return;}
  sset('unl',ph);
  T.art.publish(doc).then(function(){m.className='okmsg';m.textContent='تم الحفظ، وستُحدَّث الصفحة.';}).catch(function(er){
    sdel('unl');m.className='err';
    var c=er&&er.code;
    m.textContent=(c==='not_writer'||c==='not_granted')?'هذا الخيار لصاحبة الصفحة فقط.':c==='conflict'?'تم تحديث الصفحة من مكان آخر، أعيدي المحاولة بعد التحميل.':c==='rate_limited'?'محاولات كثيرة، انتظري قليلاً.':'تعذّر الحفظ، حاولي مرة أخرى.';
  });
}
function copyResult(){
  var txt='الاسم: '+Q.name+' | الصف التاسع 9 | تحليل ثلاثية الحدود | الدرجة: '+ar(score())+' من '+ar(QZ.length);
  var m=$('#cmsg');
  function fb(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();m.textContent=ok?'تم النسخ، أرسلها للمعلمة.':txt;}
  try{navigator.clipboard.writeText(txt).then(function(){m.textContent='تم النسخ، أرسلها للمعلمة.';},fb);}catch(e){fb();}
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),k=+b.getAttribute('data-k');
  switch(a){
   case 'login':login();return;
   case 'teacher':var p=$('#tpanel');p.hidden=!p.hidden;if(!p.hidden)p.innerHTML=teacherPanel();return;
   case 'tsave':saveTeacher();return;
   case 'lock':sdel('unl');S.view='gate';render();top();return;
   case 'tab':S.tab=b.getAttribute('data-v');render();top();return;
   case 'lesson':S.lesson=i;render();top();return;
   case 'tnext':S.ts=Math.min(4,S.ts+1);render();return;
   case 'tback':S.ts=Math.max(0,S.ts-1);render();return;
   case 'enext':S.st[S.lesson]=Math.min(EX[S.lesson-1].steps.length-1,(S.st[S.lesson]||0)+1);render();return;
   case 'eback':S.st[S.lesson]=Math.max(0,(S.st[S.lesson]||0)-1);render();return;
   case 'try':S.pk[S.lesson]=k;render();return;
   case 'prac':if(S.pr[S.lesson]===undefined){S.pr[S.lesson]=k;render();}return;
   case 'qgo':var v=($('#sname').value||'').trim();if(v.length<2){$('#nerr').hidden=false;$('#sname').focus();return;}Q.name=v;Q.phase='confirm';render();top();return;
   case 'qedit':Q.phase='start';render();return;
   case 'qstart':Q.perm=QZ.map(function(q){return shuffle(q.o.map(function(_,j){return j;}));});Q.ans=[];Q.i=0;Q.sel=-1;Q.phase='run';render();top();return;
   case 'qpick':Q.sel=k;render();return;
   case 'qnext':if(Q.sel<0)return;Q.ans[Q.i]=Q.perm[Q.i][Q.sel];Q.sel=-1;if(Q.i>=QZ.length-1){Q.phase='done';}else{Q.i++;}render();top();return;
   case 'qcopy':copyResult();return;
   case 'qagain':Q.phase='start';render();top();return;
  }
});
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='pw'){e.preventDefault();login();}
  else if(e.target.id==='sname'){e.preventDefault();var b=$('[data-act=qgo]');if(b)b.click();}
});
app.addEventListener('input',function(e){
  if(e.target.id==='pw'){var er=$('#perr');if(er)er.hidden=true;}
  if(e.target.id==='sname'){var n=$('#nerr');if(n&&e.target.value.trim().length>=2)n.hidden=true;}
});

if(sget('unl')&&sget('unl')===CFG.ph)S.view='app';
render();
(async function(){
  try{
    if(window.claude&&window.claude.use){
      var u=await window.claude.use('user');
      T.canEdit=u?await u.canEdit():false;
      T.art=await window.claude.use('artifact');
    }
  }catch(e){}
  T.ready=true;refreshTeacher();
})();
})();
</script>

</body></html>
